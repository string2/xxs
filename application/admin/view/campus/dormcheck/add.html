<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Dorm_admin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-dorm_admin_id" data-rule="required" min="0" data-source="campus/dormadmin/index" data-field="name" class="form-control selectpage" name="row[dorm_admin_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Building_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-building_id" data-rule="required" min="0" data-source="campus/dormbuilding/index" data-field="name" class="form-control selectpage" name="row[building_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Check_date')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-check_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[check_date]" type="text" value="{:date('Y-m-d')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" data-rule="required" class="form-control" name="row[remark]" type="text" value="">
        </div>
    </div>
    <div class="form-group layer-footer">
        <div class="col-xs-12 text-center">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
