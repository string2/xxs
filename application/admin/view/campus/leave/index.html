<div class="panel panel-default panel-intro">
    
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <ul class="nav nav-tabs" data-field="status">
            <li class="{:$Think.get.status === null ? 'active' : ''}"><a href="#t-all" data-value="" data-toggle="tab">{:__('All')}</a></li>
            {foreach name="statusList" item="vo"}
            <li class="{:$Think.get.status === (string)$key ? 'active' : ''}"><a href="#t-{$key}" data-value="{$key}" data-toggle="tab">{$vo}</a></li>
            {/foreach}
        </ul>
    </div>


    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('campus/leave/add')?'':'hide'}" title="{:__('Add')}" data-area='["1100px","95%"]'><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('campus/leave/edit')?'':'hide'}" title="{:__('Edit')}" data-area='["1100px","95%"]'><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('campus/leave/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>
                        <a href="javascript:;" class="btn btn-success btn-approve btn-disabled disabled {:$auth->check('campus/leave/approve')?'':'hide'}" title="同意"><i class="fa fa-check"></i> 同意</a>
                        <a href="javascript:;" class="btn btn-warning btn-reject btn-disabled disabled {:$auth->check('campus/leave/reject')?'':'hide'}" title="拒绝"><i class="fa fa-times"></i> 拒绝</a>
                        <span class="form-inline" style="margin-left:10px;">
                            <input type="text" class="form-control datetimerange" id="stat-range" style="width:260px;" placeholder="统计时间范围" autocomplete="off">
                            <a href="javascript:;" class="btn btn-info btn-stat {:$auth->check('campus/leave/statistics')?'':'hide'}"><i class="fa fa-bar-chart"></i> 统计人数</a>
                        </span>
                        <span id="stat-result" class="text-muted" style="margin-left:10px;"></span>

                        <div class="dropdown btn-group {:$auth->check('campus/leave/multi')?'':'hide'}">
                            <a class="btn btn-primary btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-cog"></i> {:__('More')}</a>
                            <ul class="dropdown-menu text-left" role="menu">
                                {foreach name="statusList" item="vo"}
                                <li><a class="btn btn-link btn-multi btn-disabled disabled" href="javascript:" data-params="status={$key}">{:__('Set status to ' . $key)}</a></li>
                                {/foreach}
                            </ul>
                        </div>

                        
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('campus/leave/edit')}"
                           data-operate-del="{:$auth->check('campus/leave/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
