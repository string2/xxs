<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Exam_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-exam_id" data-rule="required" min="0" data-source="campus/exam/index" data-field="name" class="form-control selectpage" name="row[exam_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Student_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-student_id" data-rule="required" min="0" data-source="campus/student/index" data-field="name" class="form-control selectpage" name="row[student_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Class_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-class_id" data-rule="required" min="0" data-source="campus/schoolclass/index" data-field="name" class="form-control selectpage" name="row[class_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Subject')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-subject" data-rule="required" class="form-control selectpicker" name="row[subject]">
                {foreach name="subjectList" item="vo"}
                <option value="{$vo}">{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">请选择单科。总分由系统按各科自动汇总，请勿手工录入「总分」。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Score')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-score" data-rule="required" class="form-control" step="0.01" name="row[score]" type="number" value="0.00">
        </div>
    </div>
    <input type="hidden" name="row[is_total]" value="0">
    <div class="form-group layer-footer">
        <div class="col-xs-12 text-center">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
